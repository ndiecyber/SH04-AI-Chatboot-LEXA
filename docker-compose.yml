version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lexa_postgres
    environment:
      POSTGRES_DB: lexa_db
      POSTGRES_USER: lexa_user
      POSTGRES_PASSWORD: lexa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexa_user -d lexa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lexa_api:
    build: .
    container_name: lexa_api
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://lexa_user:lexa_password@postgres:5432/lexa_db
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
